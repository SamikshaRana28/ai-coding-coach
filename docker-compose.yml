version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coding_coach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coding_coach"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/coding_coach
      GROQ_API_KEY: ${GROQ_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}   # enables POST /admin/problems when set
    depends_on:
      db:
        condition: service_healthy   # `alembic upgrade head` runs on start
    volumes:
      - ./backend:/app
      - ./data:/data:ro              # dataset for `python -m scripts.seed_problems`

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: